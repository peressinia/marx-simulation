<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marx's Relative Surplus Value Simulation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background-color: #262626;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #ff4d4d; border-bottom: 2px solid #404040; padding-bottom: 10px; }
        .control-group { margin: 25px 0; }
        label { display: block; font-weight: bold; margin-bottom: 10px; font-size: 1.1em; }
        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: #404040;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff4d4d;
            cursor: pointer;
        }
        .timeline-container { margin: 35px 0 20px 0; }
        .timeline-label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; }
        .timeline-bar {
            display: flex;
            height: 45px;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #000;
        }
        .necessary-labor {
            background-color: #4da6ff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: width 0.3s ease;
            text-shadow: 0px 0px 2px rgba(255,255,255,0.5);
        }
        .surplus-labor {
            background-color: #ff4d4d;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: width 0.3s ease;
        }
        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
            background: #1f1f1f;
            padding: 15px;
            border-radius: 6px;
        }
        .metric-box span { display: block; font-size: 1.5em; font-weight: bold; margin-top: 5px; }
        .blue-text { color: #4da6ff; }
        .red-text { color: #ff4d4d; }
    </style>
</head>
<body>

<div class="container">
    <h2>Marx's Relative Surplus Value Calculator</h2>
    <p>Adjust the slider to simulate an increase in industrial productivity (machinery, organization) during a fixed 8-hour shift.</p>
    
    <div class="control-group">
        <label id="productivity-label">Productivity Level: 1x (Traditional)</label>
        <input type="range" id="productivity-slider" min="1" max="5" step="1" value="1">
    </div>

    <div class="timeline-container">
        <div class="timeline-label">
            <span>Start of Shift (0h)</span>
            <span>End of Shift (8h)</span>
        </div>
        <div class="timeline-bar">
            <div id="necessary-block" class="necessary-labor">Necessary</div>
            <div id="surplus-block" class="surplus-labor">Surplus</div>
        </div>
    </div>

    <div class="metrics">
        <div class="metric-box">
            Worker's Paid Share:<br>
            <span id="necessary-hours" class="blue-text">4.0 Hours</span>
        </div>
        <div class="metric-box">
            Capitalist's Unpaid Share:<br>
            <span id="surplus-hours" class="red-text">4.0 Hours</span>
        </div>
    </div>
</div>

<script>
    const slider = document.getElementById('productivity-slider');
    const label = document.getElementById('productivity-label');
    const necessaryBlock = document.getElementById('necessary-block');
    const surplusBlock = document.getElementById('surplus-block');
    const necessaryHoursText = document.getElementById('necessary-hours');
    const surplusHoursText = document.getElementById('surplus-hours');

    // Total fixed working day parameters
    const totalHours = 8;

    function updateSimulation() {
        const productivity = parseInt(slider.value);
        
        // As productivity multiplier increases, the necessary time to reproduce the wage shrinks
        // Baseline (1x) requires 4 hours. At 4x productivity, it only takes 1 hour.
        const necessaryHours = (4 / productivity).toFixed(1);
        const surplusHours = (totalHours - necessaryHours).toFixed(1);

        // Calculate percentages for CSS layout widths
        const necessaryPercent = (necessaryHours / totalHours) * 100;
        const surplusPercent = 100 - necessaryPercent;

        // Update Text Descriptions
        if (productivity === 1) {
            label.innerText = `Productivity Level: 1x (Traditional - 10 Prybars)`;
        } else if (productivity === 5) {
            label.innerText = `Productivity Level: 5x (Hyper-Automated - 50 Prybars)`;
        } else {
            label.innerText = `Productivity Level: ${productivity}x (Advanced - ${productivity * 10} Prybars)`;
        }

        // Apply visual widths dynamically
        necessaryBlock.style.width = necessaryPercent + '%';
        surplusBlock.style.width = surplusPercent + '%';

        // Update block text labels if they have enough space to show
        necessaryBlock.innerText = necessaryPercent > 15 ? 'Paid Labor' : 'Paid';
        surplusBlock.innerText = surplusPercent > 15 ? 'Unpaid Surplus' : 'Surplus';

        // Update numeric readouts
        necessaryHoursText.innerText = `${necessaryHours} Hours`;
        surplusHoursText.innerText = `${surplusHours} Hours`;
    }

    slider.addEventListener('input', updateSimulation);
    updateSimulation(); // Run on initial load
</script>

</body>
</html>
